<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfriCompta+</title>
<style>body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#f4f7f5;color:#12372c;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
.b{max-width:420px;padding:24px}.s{width:34px;height:34px;border:4px solid #cfe3da;border-top-color:#0b6b4f;border-radius:50%;margin:18px auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
button{padding:12px 22px;border:0;border-radius:10px;background:#0b6b4f;color:#fff;font-size:16px;cursor:pointer}.h{display:none}</style></head>
<body><div class="b"><h2>AfriCompta+</h2><div id="load"><div class="s"></div><p>…</p></div>
<div id="off" class="h"><p id="msg"></p><button onclick="go()">↻</button></div></div>
<script>
// Adresse du panel web AfriCompta+ (à adapter si vous hébergez le panel ailleurs).
const APP_URL = "https://wiseos.alwaysdata.net/africompta/web/index.php";
const L = (navigator.language || "en").slice(0, 2);
const T = { fr: "Pas de connexion internet. Vérifiez votre réseau puis réessayez.", es: "Sin conexión a internet. Compruebe su red e inténtelo de nuevo.", en: "No internet connection. Check your network and try again." };
async function go() {
  document.getElementById("off").className = "h"; document.getElementById("load").className = "";
  try { await fetch(APP_URL, { mode: "no-cors", cache: "no-store" }); location.replace(APP_URL); }
  catch (e) { document.getElementById("load").className = "h"; document.getElementById("off").className = ""; document.getElementById("msg").textContent = T[L] || T.en; }
}
go();
</script></body></html>
